[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "amla-at2-meteo-api-25609227"
version = "0.1.0"
description = "FastAPI app for Sydney weather predictions (AMLA AT2). Provides endpoints to predict rain in 7 days and cumulative precipitation in 3 days. Includes trained models, Dockerfile, and setup instructions. Models trained with historical Open-Meteo data and deployed on Render."
packages = [
    { include = "app" }
]
authors = [
  "Nelkit Chavez"
]
package-mode = false

readme = "README.md"

[tool.poetry.dependencies]
python = "==3.11.4"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
pandas = "2.2.2"
joblib = "^1.5.2"
scikit-learn = "1.5.1"
ipython = "^9.5.0"
requests-cache = "^1.2.1"
retry-requests = "^2.0.0"
jinja2 = "^3.1.6"

[[tool.poetry.source]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"



